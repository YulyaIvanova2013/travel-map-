<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Travel Map — Profile Game</title>
<style>
*{box-sizing:border-box}
:root{--ink:#17324d;--accent:#2f93ff}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden}
body{font-family:"Trebuchet MS",Arial,sans-serif;color:var(--ink);background:#eefaff}
button,input{font:inherit}
.screen{display:none;width:100vw;height:100dvh;min-height:0;overflow:hidden}
.screen.active{display:flex}

/* COVER */
#cover{align-items:center;justify-content:center;padding:10px;background:linear-gradient(#83dcff,#ebfbff)}
.cover-wrap{position:relative;width:min(860px,94vw);max-height:94dvh;border-radius:24px;overflow:hidden;border:7px solid #fff;box-shadow:0 18px 45px #17324d33;display:flex;align-items:center;justify-content:center}
.cover-wrap img{display:block;max-width:100%;max-height:94dvh;width:auto;height:auto;object-fit:contain}
.start{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);border:4px solid #fff;border-radius:999px;padding:9px 22px;font-weight:900;font-size:clamp(16px,2vw,20px);background:#ffd33d;color:#17324d;box-shadow:0 5px 0 #dc9a14;cursor:pointer;white-space:nowrap}
.start:active{transform:translateX(-50%) translateY(2px);box-shadow:0 2px 0 #dc9a14}

/* BOARD */
#board{flex-direction:column;align-items:center;padding:10px 12px 12px;background:radial-gradient(circle at 50% 0,#e0f8ff,#fff8dd 68%,#e9f8ef)}
.title{flex:0 0 auto;font-size:clamp(27px,4.5vw,48px);line-height:1;margin:2px 0 4px;text-align:center;font-weight:1000}
.subtitle{flex:0 0 auto;font-size:clamp(15px,1.8vw,21px);line-height:1.2;text-align:center;margin:2px 0 10px}
.grid{flex:1 1 auto;min-height:0;width:min(720px,92vw);height:calc(100dvh - 100px);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px}
.card{position:relative;min-width:0;min-height:0;border:5px solid #fff;border-radius:22px;background:#fff;padding:9px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 10px 22px #17324d22;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.card img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:15px}
.open-label{position:absolute;left:9px;bottom:9px;background:#17324de8;color:#fff;border-radius:10px;padding:5px 9px;font-size:12px;font-weight:900;letter-spacing:.2px}
.done{display:none;position:absolute;right:9px;top:9px;width:42px;height:42px;border-radius:50%;background:#37c66a;color:#fff;border:4px solid #fff;align-items:center;justify-content:center;font-size:23px;font-weight:900}
.card.completed .done{display:flex}

/* TASK */
#task{flex-direction:column;padding:8px 10px 10px;background:linear-gradient(135deg,#eaf9ff,#fff8df)}
.topbar{flex:0 0 auto;width:min(1060px,97vw);height:54px;margin:0 auto;display:flex;align-items:center;gap:10px}
.back{border:0;background:linear-gradient(180deg,#49b8ff,#1f8fff);color:#fff;border-radius:15px;padding:10px 17px;font-weight:900;font-size:17px;box-shadow:0 5px 0 #176fc7,0 8px 16px rgba(0,0,0,.12);cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.back:active{transform:translateY(2px);box-shadow:0 2px 0 #176fc7,0 4px 9px rgba(0,0,0,.12)}
.progress{margin-left:auto;font-size:20px;font-weight:900;white-space:nowrap}
.mobile-tabs{display:none}
.panel{flex:1 1 auto;min-height:0;width:min(1060px,97vw);height:calc(100dvh - 72px);margin:5px auto 0;background:#fff;border-radius:24px;padding:14px;box-shadow:0 14px 32px #17324d20;display:grid;grid-template-columns:1.04fr .96fr;gap:16px;overflow:hidden}
.task-pane{min-width:0;min-height:0;overflow:hidden}
.story-pane{display:flex;flex-direction:column}
.form-pane{display:flex;flex-direction:column}
.profile-head{flex:0 0 auto;display:flex;gap:13px;align-items:center;margin-bottom:9px}
.avatar-wrap{width:96px;height:96px;border-radius:20px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff;box-shadow:0 7px 17px rgba(23,50,77,.14);flex:0 0 auto}
.avatar{width:100%;height:100%;object-fit:cover;object-position:center center;display:block}
.who{font-size:clamp(24px,2.4vw,31px);line-height:1;margin:0;font-weight:1000}
.instruction{font-size:clamp(15px,1.55vw,19px);line-height:1.2;margin:4px 0 0;color:#52677b}
.story{flex:1 1 auto;min-height:0;font-size:clamp(17px,1.72vw,23px);line-height:1.38;background:#f7fbff;border:3px dashed #bddff2;border-radius:18px;padding:13px;overflow:hidden}
.story span{border-radius:6px;padding:1px 3px}
.story span.hl{background:#fff099;box-shadow:0 0 0 3px #ffd44b}
.form{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:6px;justify-content:center}
.row{display:grid;grid-template-columns:1.08fr 1fr;gap:7px;align-items:center;background:#fafafa;padding:6px 7px;border-radius:12px;min-height:0}
.label{font-size:clamp(15px,1.45vw,18px);line-height:1.1;font-weight:900}
input{width:100%;font-size:clamp(16px,1.55vw,19px);padding:8px 9px;border:3px solid #cbd8e4;border-radius:10px;outline:none;min-height:38px}
input:focus{border-color:var(--accent)}
input.ok{border-color:#2dbb65;background:#eafff1}
input.bad{border-color:#ef5350;background:#fff1f1}
.actions{flex:0 0 auto;display:flex;gap:8px;margin-top:7px}
.check,.retry{flex:1;border:0;border-radius:14px;padding:10px;font-size:clamp(17px,1.65vw,20px);font-weight:1000;cursor:pointer;min-height:42px}
.check{background:var(--accent);color:#fff}
.retry{background:#ffe36d;color:#17324d}
.result{flex:0 0 auto;min-height:25px;font-size:clamp(16px,1.55vw,20px);line-height:1.1;font-weight:1000;text-align:center;margin-top:4px}

/* MOBILE: no page scrolling, switch between TEXT and PROFILE */
@media(max-width:700px){
  #cover{padding:8px}.cover-wrap{width:95vw;max-height:95dvh;border-width:5px;border-radius:20px}.cover-wrap img{max-height:95dvh}.start{bottom:10px;padding:8px 18px;font-size:17px}
  #board{padding:7px 8px 9px}.title{font-size:clamp(26px,8vw,36px);margin:1px 0 3px}.subtitle{font-size:14px;margin:1px 8px 7px}.grid{width:94vw;height:calc(100dvh - 82px);gap:8px}.card{border-width:4px;border-radius:18px;padding:6px}.card img{border-radius:12px}.open-label{left:6px;bottom:6px;font-size:10px;padding:4px 6px}.done{width:34px;height:34px;font-size:18px;border-width:3px;right:6px;top:6px}
  #task{padding:5px 7px 7px}.topbar{width:97vw;height:43px}.back{font-size:14px;padding:8px 11px;border-radius:12px;box-shadow:0 4px 0 #176fc7}.progress{font-size:16px}.mobile-tabs{flex:0 0 auto;width:97vw;height:42px;margin:2px auto 3px;display:grid;grid-template-columns:1fr 1fr;gap:7px}.tab-btn{border:0;border-radius:12px;background:#dcecff;color:#17324d;font-size:15px;font-weight:1000;cursor:pointer}.tab-btn.active{background:linear-gradient(180deg,#ffd95a,#ffc928);box-shadow:inset 0 -3px 0 #e5a719}
  .panel{display:block;width:97vw;height:calc(100dvh - 99px);margin:0 auto;padding:9px;border-radius:19px}.task-pane{display:none;height:100%;min-height:0}.task-pane.active-pane{display:flex}.story-pane.active-pane{flex-direction:column}.form-pane.active-pane{flex-direction:column}
  .profile-head{gap:9px;margin-bottom:7px}.avatar-wrap{width:72px;height:72px;border-radius:15px}.who{font-size:22px}.instruction{font-size:13px;line-height:1.15;margin-top:3px}.story{font-size:clamp(14px,3.7vw,17px);line-height:1.27;padding:10px;border-width:2px;border-radius:15px}
  .form{gap:5px;justify-content:center}.row{grid-template-columns:1fr 1.05fr;gap:5px;padding:4px 5px;border-radius:10px}.label{font-size:clamp(12px,3vw,14px);line-height:1.05}input{font-size:clamp(14px,3.4vw,16px);padding:6px 7px;min-height:34px;border-width:2px}.actions{gap:6px;margin-top:5px}.check,.retry{font-size:15px;padding:8px;min-height:37px;border-radius:11px}.result{font-size:14px;min-height:18px;margin-top:3px}
}

/* SHORT SCREENS */
@media(max-height:650px){
  .topbar{height:46px}.panel{height:calc(100dvh - 60px);padding:10px}.avatar-wrap{width:78px;height:78px}.profile-head{margin-bottom:6px}.story{font-size:16px;line-height:1.28;padding:10px}.form{gap:4px}.row{padding:4px 5px}.label{font-size:14px}input{font-size:15px;padding:5px 7px;min-height:32px}.actions{margin-top:4px}.check,.retry{padding:7px;min-height:34px;font-size:15px}.result{font-size:14px;min-height:18px}
}
@media(max-width:700px) and (max-height:650px){
  .topbar{height:39px}.mobile-tabs{height:36px;margin:1px auto 2px}.panel{height:calc(100dvh - 84px);padding:7px}.avatar-wrap{width:60px;height:60px}.who{font-size:19px}.instruction{font-size:11px}.story{font-size:13px;line-height:1.2;padding:8px}.form{gap:3px}.row{padding:3px 4px}.label{font-size:11px}input{font-size:13px;padding:4px 5px;min-height:28px}.check,.retry{font-size:13px;padding:6px;min-height:31px}.result{font-size:12px}.back{font-size:12px;padding:6px 9px}.progress{font-size:14px}.tab-btn{font-size:13px}
}
</style>

let current=null; const completed=new Set();
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0)}
function buildBoard(){const g=document.getElementById('grid');g.innerHTML='';Object.entries(data).forEach(([id,p])=>{const b=document.createElement('button');b.type='button';b.className='card'+(completed.has(id)?' completed':'');b.innerHTML=`<img src="${p.img}" alt="Child picture"><div class="open-label">TAP TO OPEN →</div><div class="done">✓</div>`;b.onclick=()=>openTask(id);g.appendChild(b)})}
function openTask(id){current=id;const p=data[id];document.documentElement.style.setProperty('--accent',p.accent);document.getElementById('avatar').src=p.img;document.getElementById('story').innerHTML=p.text;const f=document.getElementById('form');f.innerHTML='';p.fields.forEach(([label,key])=>{const r=document.createElement('div');r.className='row';r.innerHTML=`<div class="label">${label}</div><input data-key="${key}" autocomplete="off" spellcheck="false" placeholder="Type your answer…">`;f.appendChild(r)});document.getElementById('result').textContent='';updateProgress();setMobilePane('text');showScreen('task')}
function norm(s){return (s||'').toLowerCase().trim().replace(/[.,!?]/g,'').replace(/\s+/g,' ')}
function checkAnswers(){const p=data[current];let score=0;document.querySelectorAll('#story span').forEach(s=>s.classList.remove('hl'));document.querySelectorAll('#form input').forEach(inp=>{const field=p.fields.find(x=>x[1]===inp.dataset.key);const ok=field[2].map(norm).includes(norm(inp.value));inp.classList.toggle('ok',ok);inp.classList.toggle('bad',!ok);if(ok)score++;document.querySelectorAll(`#story [data-key="${inp.dataset.key}"]`).forEach(s=>s.classList.add('hl'))});const total=p.fields.length;document.getElementById('result').textContent=`${score} / ${total} correct ${score===total?'🌟':'— check the highlighted clues!'}`;if(score===total){completed.add(current);updateProgress()}}
function retry(){document.querySelectorAll('#form input').forEach(i=>{i.value='';i.classList.remove('ok','bad')});document.querySelectorAll('#story span').forEach(s=>s.classList.remove('hl'));document.getElementById('result').textContent=''}
function updateProgress(){document.getElementById('progress').textContent=`⭐ ${completed.size} / 4`}
function setMobilePane(which){const story=document.getElementById('storyPane'),form=document.getElementById('formPane'),textTab=document.getElementById('textTab'),formTab=document.getElementById('formTab');if(which==='form'){story.classList.remove('active-pane');form.classList.add('active-pane');textTab.classList.remove('active');formTab.classList.add('active')}else{form.classList.remove('active-pane');story.classList.add('active-pane');formTab.classList.remove('active');textTab.classList.add('active')}}
document.getElementById('startBtn').onclick=()=>{buildBoard();showScreen('board')};
document.getElementById('backBtn').onclick=()=>{buildBoard();showScreen('board')};
document.getElementById('checkBtn').onclick=checkAnswers;
document.getElementById('retryBtn').onclick=retry;
document.getElementById('textTab').onclick=()=>setMobilePane('text');
document.getElementById('formTab').onclick=()=>setMobilePane('form');
buildBoard();updateProgress();
</script></body></html>
